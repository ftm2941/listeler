name: Update Mac Ozetleri M3U8

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore scraper
        run: |
          printf '%s' '' | base64 -d > scrape_macozetleri.py
          python -c "import ast; ast.parse(open('scrape_macozetleri.py').read()); print('script syntax OK')"

      - name: Scrape match summaries
        run: python scrape_macozetleri.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- macozetleri.m3u8; then
            echo "No changes"
            exit 0
          fi
          git add macozetleri.m3u8
          git commit -m "chore: update mac ozetleri m3u8"
          git push
