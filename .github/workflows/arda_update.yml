name: ArdaSpor M3U Guncelleme

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Playwright ve Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Scraper Scriptini Calistir
        run: |
          python arda_scraper.py

      - name: Degisiklikleri Git ile Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kanallar_arda.m3u8
          git commit -m "Otomatik ArdaSpor M3U Guncellemesi [skip ci]" || echo "Degisiklik yok"
          git push
