name: Update macozetleri.m3u8

on:
  schedule:
    - cron: "0 */3 * * *" # Her 3 saatte bir (UTC)
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: "Mevcut kayıtların linklerini de yeniden kontrol et (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: Build macozetleri.m3u8
        env:
          SOURCE_URL: "https://beinsports.com.tr/mac-ozetleri-goller/super-lig"
          OUTPUT_FILE: "macozetleri.m3u8"
          REFRESH_EXISTING: "${{ inputs.refresh_existing || 'false' }}"
        run: |
          python scripts/update_macozetleri.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macozetleri.m3u8
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi

          git commit -m "chore: update macozetleri.m3u8 [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Push başarılı."
              exit 0
            fi
            echo "Push denemesi $attempt başarısız, tekrar deneniyor..."
            sleep 2
          done

          echo "Tüm push denemeleri başarısız oldu."
          exit 1
