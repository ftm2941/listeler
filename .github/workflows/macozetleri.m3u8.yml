name: Update macozetleri.m3u8

on:
  schedule:
    - cron: "0 */3 * * *" # Her 3 saatte bir (UTC)
  workflow_dispatch: # GitHub arayüzünden tek tıkla manuel çalıştırma

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: Build macozetleri.m3u8
        env:
          SOURCE_URL: "https://beinsports.com.tr/mac-ozetleri-goller/super-lig"
          OUTPUT_FILE: "macozetleri.m3u8"
        run: |
          python scripts/update_macozetleri.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macozetleri.m3u8
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: update macozetleri.m3u8 [skip ci]"
            git push
          fi
