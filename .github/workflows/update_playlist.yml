name: Update Vavoo M3U Playlist

on:
  schedule:
    # Her 3 saatte bir otomatik calisir
    - cron: '0 */3 * * *'
  workflow_dispatch: # GitHub uzerinden manuel başlatma butonu sunar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run playlist generator
        run: python scripts/update_playlist.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Auto-update playlist.m3u"
          git push
