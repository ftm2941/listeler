name: TvDiziler Otomatik Takip

on:
  schedule:
    - cron: '0 */4 * * *' # Her 4 saatte bir çalıştırır
  workflow_dispatch:

jobs:
  scrape-tvdiziler:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # cache: 'pip' satırını sildik çünkü requirements.txt yok

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Botu Çalıştır
        run: python tvdiziler_bot.py

      - name: Güncellemeleri Repoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tvdiziler.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Dizi listesi güncellendi: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
