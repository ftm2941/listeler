name: TvDiziler M3U Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tvdiziler:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Botu Calistir
        run: |
          python tvdiziler_bot.py

      - name: Degisiklikleri Kaydet ve Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tvdiziler.m3u8
          git commit -m "Otomatik TvDiziler M3U Guncellemesi [skip ci]" || echo "Degisiklik yok"
          git push
