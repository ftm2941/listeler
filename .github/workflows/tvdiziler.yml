name: tvdiziler guncelle

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvdiziler
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install requests beautifulsoup4

      - name: Calistir
        env:
          PYTHONIOENCODING: utf-8
        run: python tvdiziler_bot.py

      - name: Degisiklik var mi?
        id: diff
        run: |
          if git diff --quiet -- tvdiziler.m3u8; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit ve push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvdiziler.m3u8
          git commit -m "chore: tvdiziler m3u8 guncelle"
          git pull --rebase
          git push
