name: M3U Playlist Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Repoya push yapabilmesi için yazma izni veriyoruz
permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Python Betiğini Çalıştır (mahsun.py)
        run: |
          python mahsun.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Oluşan tüm m3u8 dosyalarını ekler (dosya adı ne olursa olsun yakalar)
          git add *.m3u8
          
          git commit -m "Otomatik M3U Guncellemesi [skip ci]" || echo "Değişiklik yok"
          git push
