name: M3U Playlist Guncelleme

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (istersen süreyi değiştirebilirsin)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Python Betiğini Çalıştır
        run: |
          python mahsun.py

      - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kanallar.m3u8
          git commit -m "Otomatik M3U Playlist Güncellemesi [skip ci]" || echo "Değişiklik yok"
          git push
