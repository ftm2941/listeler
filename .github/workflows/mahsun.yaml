name: M3U Playlist Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Python Betiğini Çalıştır (mahsun.py)
        run: |
          python mahsun.py

      - name: Değişiklikleri Kaydet ve Gönder (kanallar2.m3u8)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kanallar2.m3u8
          git commit -m "Otomatik kanallar2.m3u8 Guncellemesi [skip ci]" || echo "Değişiklik yok"
          git push
